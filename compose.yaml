# The cleanup bot: the code sandbox and the web UI. From the repo root:
#   docker compose up -d --build    build (if needed) and start
#   docker compose logs -f          follow the logs
#   docker compose down             stop and remove the containers
#
#   executor  runs model-written code. Only on the "sandbox" network, which
#             has no route to the internet or to the host.
#   proxy     relays 127.0.0.1:8000 to executor:8000; the only way into the
#             sandbox from the host (used by the CLI, the evals and the tests).
#   ui        the web app at http://127.0.0.1:7860. Reaches the executor over
#             the sandbox network and Ollama on the host.

services:
  executor:
    build: ./executor
    networks: [sandbox]
    environment:
      EXECUTOR_SANDBOXED: "1"     # reported by /health; the agent refuses an executor without it
    volumes:
      - ./data:/data:ro           # read-only: model code can't change the original CSVs
      - ./output:/output
    read_only: true
    tmpfs:                        # in-memory scratch space, wiped when the container stops
      - /tmp
      - /home/analyst:uid=1000,gid=1000,mode=700  # Jupyter's runtime files
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    memswap_limit: 4g             # 4 GB in total; otherwise Docker allows as much again in swap
    cpus: 2
    pids_limit: 256               # no fork bombs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  proxy:
    image: alpine/socat:1.8.0.0
    # Listen on 8000 and relay every connection to executor:8000, nowhere else.
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:executor:8000"]
    networks: [sandbox, outside]
    ports:
      - "127.0.0.1:8000:8000"     # this machine only, not the local network
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      executor:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: ./agent
    # "outside" is needed to reach Ollama and publish the port. This container
    # runs only the app's own code; model code runs only in the executor.
    networks: [sandbox, outside]
    environment:
      # Paths as seen from inside the container (read by config.py). Running
      # the UI directly on the host needs none of these.
      ANALYST_EXECUTOR_URL: http://executor:8000
      ANALYST_OLLAMA_HOST: http://host.docker.internal:11434
      ANALYST_DATA_DIR: /data
      ANALYST_OUTPUT_DIR: /output
      ANALYST_UI_HOST: 0.0.0.0    # inside the container; see ports for who can connect
    extra_hosts: ["host.docker.internal:host-gateway"]   # same host name on Linux
    volumes:
      - ./data:/data              # writable here (uploads go to data/uploads/)
      - ./output:/output:ro       # cleaned files and reports, for downloading
    ports:
      - "127.0.0.1:7860:7860"
    read_only: true
    tmpfs:
      - /tmp                      # Gradio's upload cache, in memory only
      - /home/app:uid=1000,gid=1000,mode=700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    depends_on:
      executor:
        condition: service_healthy
    restart: unless-stopped

networks:
  sandbox:
    internal: true    # no gateway: no internet, no host
  outside: {}         # an ordinary network, so ports can be published

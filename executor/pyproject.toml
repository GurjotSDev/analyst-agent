[project]
name = "executor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GurjotSDev", email = "har03gur@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
executor = "executor:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

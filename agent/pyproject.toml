[project]
name = "agent"
version = "0.1.0"
description = "Local data analyst agent"
readme = "README.md"
authors = [
    { name = "GurjotSDev", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
]

[project.scripts]
analyst = "agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
